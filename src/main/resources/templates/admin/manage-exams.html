<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Examinations - Admin Panel</title>
    <!-- Fragments Styles -->
    <th:block th:replace="~{fragments/footer :: styles}"></th:block>
</head>
<body>

    <div class="dashboard-wrapper">
        <!-- Sidebar Navigation (Active: 'exams') -->
        <div th:replace="~{fragments/navbar :: admin-sidebar('exams')}"></div>
        
        <!-- Main Content -->
        <div class="main-content">
            <!-- Header Toolbar -->
            <header th:replace="~{fragments/navbar :: dashboard-header('Manage Scheduled Examinations')}"></header>
            
            <div class="content-body">
                <!-- Response alerts -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show rounded-3 mb-4" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${success}">Exam scheduled successfully!</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                
                <div class="row g-4">
                    <!-- LEFT COLUMN: ADD EXAM FORM CARD -->
                    <div class="col-xl-4">
                        <div class="card card-premium p-4 border-0 bg-white">
                            <h5 class="fw-bold text-dark mb-4"><i class="fas fa-plus-circle text-primary me-2"></i>
                            <span th:text="${exam.id == 0 ? 'Create New Exam' : 'Edit Exam'}"> Create New Exam</span>
                            </h5>
                            
<form th:action="${exam.id == 0} ? '/admin/add-exam' : '/admin/exams/update'"
      th:object="${exam}"
      method="post">

    <input type="hidden" th:field="*{id}">                                <!-- Exam Title -->
                                <div class="mb-3">
                                    <label class="form-label fw-semibold text-dark">Exam Title</label>
                                    <input type="text" class="form-control rounded-3" th:field="*{examName}" placeholder="e.g. Core Java Basics" required>
                                    <div class="invalid-feedback">Please enter exam title.</div>
                                </div>
                                
                                <div class="row g-2">
                                    <!-- Category -->
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-semibold text-dark">Category</label>
                                       <select class="form-select rounded-3"
									        th:field="*{subject}"
									        required>
									
									    <option value="" disabled>Select</option>
									
									    <option value="Technical">Technical</option>
									    <option value="Database">Database</option>
									    <option value="Aptitude">Aptitude</option>
									    <option value="General">General</option>
									
									</select>
                                    </div>
                                    <!-- Duration -->
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-semibold text-dark">Duration (Min)</label>
                                        <input type="number" class="form-control rounded-3" th:field="*{duration}" placeholder="e.g. 60" required min="5">
                                    </div>
                                </div>
                                
                                <div class="row g-2">
                                    <!-- Total Qs -->
                                    <div class="col-6 mb-3">
                                        <label class="form-label fw-semibold text-dark">Total Qs</label>
                                        <input type="number" class="form-control rounded-3" th:field="*{totalMarks}" placeholder="30" required min="1">
                                    </div>
                                    <!-- Passing Marks -->
                                    <div class="col-6 mb-3">
                                        <label class="form-label fw-semibold text-dark">Passing Marks</label>
                                        <input type="number" class="form-control rounded-3" th:field="*{passingScore}" placeholder="60" required min="1">
                                    </div>
                                </div>
                                
                                <!-- Description -->
                                <div class="mb-4">
                                    <label class="form-label fw-semibold text-dark">Brief Description</label>
                                    <textarea class="form-control rounded-3" th:field="*{description}" rows="3" placeholder="Syllabus coverage & parameters..." required></textarea>
                                </div>
                                
                                <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-3 fw-bold shadow-sm">
                                <span th:text="${exam.id == 0 ? 'Schedule Exam' : 'Update Exam'}">Schedule Exam </span>
                                    <i class="fas fa-calendar-plus ms-1"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                    
                    <!-- RIGHT COLUMN: SEARCH & EXAMS MANAGEMENT TABLE -->
                    <div class="col-xl-8">
                        <div class="card card-premium p-4 border-0 bg-white">
                            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                                <h5 class="fw-bold text-dark mb-0">Scheduled Exam Sets</h5>
                                
                               
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0" style="font-size: 0.9rem;">
                                    <thead class="table-light text-gray-500" style="font-size: 0.85rem;">
                                        <tr>
                                            <th>Title</th>
                                            <th>Category</th>
                                            <th>Duration</th>
                                            <th>Questions</th>
                                            <th>Pass Score</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                              <tbody id="examTableBody">

    <tr th:each="ex : ${scheduledExamsList}">

        <td class="fw-bold text-dark"
            th:text="${ex.examName}">
            Core Java Programming
        </td>

        <td>
            <span class="badge bg-primary-light text-primary rounded-pill px-2.5 py-1"
                  th:text="${ex.subject}">
                Technical
            </span>
        </td>

        <td th:text="${ex.duration + ' Mins'}">
            60 Mins
        </td>

        <td th:text="${ex.totalMarks + ' Marks'}">
            30 Marks
        </td>

        <td th:text="${ex.passingScore}">
            20
        </td>

        <td>
            <div class="d-flex gap-2">

                <a th:href="@{'/admin/exams/edit/' + ${ex.id}}"
                   class="btn btn-light btn-sm text-warning"
                   title="Edit">
                    <i class="fas fa-pencil-alt"></i>
                </a>

                <a th:href="@{'/admin/exams/delete/' + ${ex.id}}"
				   class="btn btn-light btn-sm text-danger"
				   title="Delete"
				   onclick="return confirm('Are you sure you want to delete this exam?');">
				
				    <i class="fas fa-trash-alt"></i>
				
				</a>
            </div>
        </td>

    </tr>

</tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts Fragment -->
    <th:block th:replace="~{fragments/footer :: scripts}"></th:block>
    
    <script>
document.addEventListener("DOMContentLoaded", function () {

    const searchInput = document.getElementById("examSearch");
    const searchForm = document.getElementById("examSearchForm");
    const tableBody = document.getElementById("examTableBody");

    if (!searchInput || !tableBody) {
        return;
    }

    // Enter press केल्यावर page reload होऊ नये
    if (searchForm) {
        searchForm.addEventListener("submit", function (event) {
            event.preventDefault();
        });
    }

    // प्रत्येक letter type केल्यावर search
    searchInput.addEventListener("input", function () {

        const keyword = this.value.toLowerCase().trim();

        const rows = tableBody.querySelectorAll("tr");

        rows.forEach(function (row) {

            const examNameCell = row.querySelector("td");

            if (!examNameCell) {
                return;
            }

            const examName = examNameCell.textContent.toLowerCase();

            if (examName.includes(keyword)) {
                row.style.display = "";
            } else {
                row.style.display = "none";
            }

        });

    });

});
</script>
</body>
</html>
